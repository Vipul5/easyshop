apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: easyshop-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port:
                  number: 80

          - path: /
            pathType: Prefix
            backend:
              service:
                name: react-service
                port:
                  number: 80