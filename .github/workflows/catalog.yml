name: Catalog CI/CD

on:
  push:
    paths:
      - 'backend/services/CatalogService/**'

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3

      - name: Set tag
        run: echo "IMAGE_TAG=$(date +%s)" >> $GITHUB_ENV

      - name: Build image
        run: docker build --platform=linux/amd64 -t easyshop-catalog-service:${{ env.IMAGE_TAG }} ./backend/services/CatalogService

      - name: Load into Kind
        run: kind load docker-image easyshop-catalog-service:${{ env.IMAGE_TAG }} --name easyshop-cluster

      - name: Deploy
        run: kubectl set image deployment/catalog-deployment catalog=easyshop-catalog-service:${{ env.IMAGE_TAG }}