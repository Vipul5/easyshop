name: UI CI/CD

on:
  push:
    paths:
      - 'frontend/ui-app/**'

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3

      - name: Set tag
        run: echo "IMAGE_TAG=$(date +%s)" >> $GITHUB_ENV

      - name: Build image
        run: docker build --platform=linux/amd64 -t easyshop-ui-app:${{ env.IMAGE_TAG }} ./frontend/ui-app

      - name: Load into Kind
        run: kind load docker-image easyshop-ui-app:${{ env.IMAGE_TAG }} --name easyshop-cluster

      - name: Deploy
        run: |
            kubectl apply -f infra/k8s/react-deployment.yaml
            kubectl apply -f infra/k8s/react-service.yaml

            kubectl set image deployment/react-deployment react=easyshop-ui-app:${{ env.IMAGE_TAG }}

            kubectl rollout status deployment/react-deployment