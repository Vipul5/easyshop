name: Identity CI/CD

on:
  push:
    paths:
      - 'backend/services/IdentityService/**'

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3

      - run: docker build -t easyshop-identity-service ./backend/services/IdentityService
      - run: kind load docker-image easyshop-identity-service --name easyshop-cluster

      - run: |
          kubectl apply -f infra/k8s/identity-deployment.yaml
          kubectl apply -f infra/k8s/identity-service.yaml
          kubectl rollout restart deployment identity-deployment