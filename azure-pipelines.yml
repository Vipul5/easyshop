trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerUsername: 'vipulpatodi'

steps:

# Install Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

# Build React App
- script: |
    cd frontend/ui-app
    npm install
    npm run build
  displayName: 'Build React App'

# Build .NET App
- script: |
    cd backend/services/CatalogService
    dotnet restore
    dotnet build --configuration Release
  displayName: 'Build .NET App'

# Docker Login
- script: |
    echo "$(dockerPassword)" | docker login -u $(dockerUsername) --password-stdin
  displayName: 'Docker Login'

# Build & Push Catalog Service
- script: |
    docker build -t $(dockerUsername)/easyshop-catalog-service:latest ./backend/services/CatalogService
    docker push $(dockerUsername)/easyshop-catalog-service:latest
  displayName: 'Build & Push Catalog Service'

# Build & Push UI App
- script: |
    docker build -t $(dockerUsername)/easyshop-ui-app:latest ./frontend/ui-app
    docker push $(dockerUsername)/easyshop-ui-app:latest
  displayName: 'Build & Push UI App'

# Deploy to AKS
- script: |
    echo "$(kubeconfig)" > kubeconfig
    export KUBECONFIG=$(pwd)/kubeconfig

    kubectl apply -f k8s/

    kubectl rollout restart deployment catalog-deployment
    kubectl rollout restart deployment react-deployment
  displayName: 'Deploy to AKS'