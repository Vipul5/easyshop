trigger:
- main

variables:
  imageName: easyshop-catalog-service

stages:

# ======================
# BUILD STAGE
# ======================
- stage: Build
  displayName: Build and Push Docker Image
  jobs:
  - job: Build
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: Docker@2
      displayName: Build and Push Image
      inputs:
        containerRegistry: dockerhub-connection
        repository: $(imageName)
        command: buildAndPush
        Dockerfile: '**/Dockerfile'
        tags: |
          latest

# ======================
# DEPLOY STAGE
# ======================
- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: Build

  jobs:
  - job: Deploy
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: Kubernetes@1
      displayName: Deploy to AKS
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'azure-connection'
        azureResourceGroup: 'easyshop-rg'
        kubernetesCluster: 'easyshop-aks'
        command: apply
        useConfigurationFile: true
        configuration: 'k8s/catalog-deployment.yaml'